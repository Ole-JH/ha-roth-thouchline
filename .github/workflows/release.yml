name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches tag
        run: |
          manifest=$(jq -r .version custom_components/roth_touchline/manifest.json)
          [ "v$manifest" = "$GITHUB_REF_NAME" ] || { echo "manifest version $manifest does not match tag $GITHUB_REF_NAME"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
